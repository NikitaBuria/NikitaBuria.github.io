<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wordle · Hebrew & English</title>
    <link rel="stylesheet" href="styles.css">
    <script src="languages.js" defer></script>
    <script src="wordle.js" defer></script>
</head>
<body>
    <header>
        <h1 id="title">וורד-לי</h1>
        <button type="button" id="language-switch">English</button>
    </header>

    <main class="game">
        <!-- The board and the keyboard are built by wordle.js -->
        <div id="board" aria-label="Game board"></div>
        <p id="message" role="status" aria-live="polite"></p>
        <div id="keyboard"></div>
    </main>
</body>
</html>
