<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wordle · Hebrew & English</title>
    <link rel="stylesheet" href="styles.css">
    <script src="wordle.js" defer></script>
</head>
<body>

<header>
    <h1 id="title">וורד-לי</h1>
    <button type="button" id="language-switch">English</button>
</header>

<main class="game">
    <div id="board" aria-label="Game board">
        <div class="row"><div id="1-1" class="cell"></div><div id="1-2" class="cell"></div><div id="1-3" class="cell"></div><div id="1-4" class="cell"></div><div id="1-5" class="cell"></div></div>
        <div class="row"><div id="2-1" class="cell"></div><div id="2-2" class="cell"></div><div id="2-3" class="cell"></div><div id="2-4" class="cell"></div><div id="2-5" class="cell"></div></div>
        <div class="row"><div id="3-1" class="cell"></div><div id="3-2" class="cell"></div><div id="3-3" class="cell"></div><div id="3-4" class="cell"></div><div id="3-5" class="cell"></div></div>
        <div class="row"><div id="4-1" class="cell"></div><div id="4-2" class="cell"></div><div id="4-3" class="cell"></div><div id="4-4" class="cell"></div><div id="4-5" class="cell"></div></div>
        <div class="row"><div id="5-1" class="cell"></div><div id="5-2" class="cell"></div><div id="5-3" class="cell"></div><div id="5-4" class="cell"></div><div id="5-5" class="cell"></div></div>
        <div class="row"><div id="6-1" class="cell"></div><div id="6-2" class="cell"></div><div id="6-3" class="cell"></div><div id="6-4" class="cell"></div><div id="6-5" class="cell"></div></div>
    </div>

    <p id="message" role="status" aria-live="polite"></p>

    <!-- Built by wordle.js for the current language -->
    <div id="keyboard"></div>
</main>

</body>
</html>
